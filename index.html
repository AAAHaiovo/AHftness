<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>健身</title>

<!-- PWA -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="健身">
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 顶栏 -->
<header id="hdr">
  <div class="hdr-in">
    <div class="hdr-l">
      <h1 id="hdrTitle">训练</h1>
      <div class="hdr-sub" id="hdrSub"></div>
    </div>
    <button class="hdr-btn" id="btnGear" aria-label="设置">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8">
        <circle cx="12" cy="12" r="3.2"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9v.09a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
  </div>
</header>

<!-- 主视图 -->
<main id="view">
  <div class="empty"><div class="ic">💪</div><div class="t">正在加载…</div></div>
</main>

<!-- 休息倒计时浮条 -->
<div id="restBar" class="rest-bar" hidden>
  <div class="rest-fill" id="restFill"></div>
  <div class="rest-in">
    <span class="rest-t" id="restTime">1:30</span>
    <span class="rest-l" id="restLabel">组间休息</span>
    <button class="rest-btn" id="restPlus">+30s</button>
    <button class="rest-btn rest-x" id="restSkip">跳过</button>
  </div>
</div>

<!-- 底部标签栏 -->
<nav id="tabs"></nav>

<!-- 弹层 -->
<div id="sheetWrap" class="sheet-wrap" hidden>
  <div class="sheet-mask" id="sheetMask"></div>
  <div class="sheet" id="sheet">
    <div class="sheet-grip"></div>
    <div class="sheet-hd">
      <button class="sheet-act" id="sheetCancel">取消</button>
      <span class="sheet-title" id="sheetTitle"></span>
      <button class="sheet-act strong" id="sheetDone">完成</button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
</div>

<!-- 轻提示 -->
<div id="toast" class="toast" hidden></div>

<!-- 图片查看 -->
<div id="lightbox" class="lightbox" hidden>
  <button class="lb-x" id="lbClose">✕</button>
  <img id="lbImg" alt="">
</div>

<script src="app.js"></script>
</body>
</html>

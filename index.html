<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<!-- user-scalable=no / maximum-scale=1：安卓和桌面 Chrome 靠这一行就够。
     iOS 从 iOS 10 起会忽略它，所以还配了两条手势拦截（见 app.js 最后一段）。 -->
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>健身</title>

<!-- PWA -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="健身">
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- AH 品牌标记 —— 只在这里写一次，顶栏和加载页都用 <use> 复用它。
     坐标是 App 版标识的原值（字高 360 / 笔画 34 / 轴距 180），三条互不重叠的路径。
     A 的顶点：斜线外缘一路斜到字顶 y=59（x=245.5），字顶一刀平切到竖线右缘 x=273。
     所以斜线是「到顶收平后就地变成那根竖线」，中间没有台阶、顶上也没有多余的一块。 -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="ahMark" viewBox="48.5 59 404.5 394">
    <path d="M245.5,59L273,59L273,453L239,453L239,148L86.5,453L48.5,453Z"/>
    <path d="M419,59h34v394h-34Z"/>
    <path d="M185.5,239H453V273H168.5Z"/>
  </symbol>
</svg>

<!-- 顶栏 -->
<header id="hdr">
  <div class="hdr-in">
    <div class="hdr-l">
      <span class="brand" aria-hidden="true"><svg viewBox="48.5 59 404.5 394"><use href="#ahMark" xlink:href="#ahMark" x="48.5" y="59" width="404.5" height="394"/></svg></span>
      <h1 id="hdrTitle">训练</h1>
      <div class="hdr-sub" id="hdrSub"></div>
    </div>
    <button class="hdr-btn" id="btnGear" aria-label="设置">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8">
        <circle cx="12" cy="12" r="3.2"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9v.09a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
  </div>
</header>

<!-- 主视图 -->
<main id="view">
  <div class="empty"><div class="ic"><svg class="ic-ah" viewBox="48.5 59 404.5 394" aria-hidden="true"><use href="#ahMark" xlink:href="#ahMark" x="48.5" y="59" width="404.5" height="394"/></svg></div><div class="t">正在加载…</div></div>
</main>

<!-- 休息倒计时浮条 -->
<div id="restBar" class="rest-bar" hidden>
  <div class="rest-fill" id="restFill"></div>
  <div class="rest-in">
    <span class="rest-t" id="restTime">1:30</span>
    <span class="rest-l" id="restLabel">组间休息</span>
    <button class="rest-btn" id="restPlus">+30s</button>
    <button class="rest-btn rest-x" id="restSkip">跳过</button>
  </div>
</div>

<!-- 底部标签栏 -->
<nav id="tabs"></nav>

<!-- 弹层 -->
<div id="sheetWrap" class="sheet-wrap" hidden>
  <div class="sheet-mask" id="sheetMask"></div>
  <div class="sheet" id="sheet">
    <div class="sheet-grip"></div>
    <div class="sheet-hd">
      <button class="sheet-act" id="sheetCancel">取消</button>
      <span class="sheet-title" id="sheetTitle"></span>
      <button class="sheet-act strong" id="sheetDone">完成</button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
</div>

<!-- 轻提示 -->
<div id="toast" class="toast" hidden></div>

<!-- 图片查看 -->
<div id="lightbox" class="lightbox" hidden>
  <button class="lb-x" id="lbClose">✕</button>
  <img id="lbImg" alt="">
</div>

<script src="app.js"></script>
</body>
</html>

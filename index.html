<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<!-- user-scalable=no / maximum-scale=1：安卓和桌面 Chrome 靠这一行就够。
     iOS 从 iOS 10 起会忽略它，所以还配了两条手势拦截（见 app.js 最后一段）。 -->
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>健身</title>

<!-- PWA -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F2F2F7">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta id="iosStatusBar" name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="健身">
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png?v=13">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png?v=13">

<!-- 外观：在样式表之前定好 light / dark，避免启动时白屏闪一下。
     存的是「用户选的模式」（light / dark / auto），实际生效值写到 data-theme。 -->
<script>
(function(){
  try{
    var m = localStorage.getItem("ah_theme") || "auto";
    var dark = m === "dark" || (m === "auto" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
    document.documentElement.setAttribute("data-theme-mode", m);
    var sb = document.getElementById("iosStatusBar");
    if (sb) sb.setAttribute("content", dark ? "black" : "default");
  }catch(e){}
})();
</script>

<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 顶栏 -->
<header id="hdr">
  <div class="hdr-in">
    <div class="hdr-l">
      <span class="brand" aria-hidden="true"><svg viewBox="0 0 628 659"><use href="#ahMark" xlink:href="#ahMark"/></svg></span>

      <div class="hdr-sub" id="hdrSub"></div>
    </div>
    <button class="hdr-btn" id="btnGear" aria-label="设置">

  </div>
</header>

<!-- 主视图 -->
<main id="view">
  <div class="empty"><div class="ic"><svg class="ic-ah" viewBox="0 0 628 659" aria-hidden="true"><use href="#ahMark" xlink:href="#ahMark"/></svg></div><div class="t">正在加载…</div></div>
</main>

<!-- 休息倒计时浮条 -->
<div id="restBar" class="rest-bar" hidden>
  <div class="rest-fill" id="restFill"></div>
  <div class="rest-in">
    <span class="rest-t" id="restTime">1:30</span>
    <span class="rest-l" id="restLabel">组间休息</span>
    <button class="rest-btn" id="restPlus">+30s</button>
    <button class="rest-btn rest-x" id="restSkip">跳过</button>
  </div>
</div>

<!-- 全屏专注 / 休息 / 锁屏预览。盖住顶栏和标签栏，退出后回到训练表格。 -->
<div id="focusRoot" class="focus-wrap" hidden></div>

<!-- 底部标签栏 -->
<nav id="tabs"></nav>

<!-- 弹层 -->
<div id="sheetWrap" class="sheet-wrap" hidden>
  <div class="sheet-mask" id="sheetMask"></div>
  <div class="sheet" id="sheet">
    <div class="sheet-grip"></div>
    <div class="sheet-hd">
      <button class="sheet-act" id="sheetCancel">取消</button>
      <span class="sheet-title" id="sheetTitle"></span>
      <button class="sheet-act strong" id="sheetDone">完成</button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
</div>

<!-- 轻提示 -->
<div id="toast" class="toast" hidden></div>

<!-- 图片查看 -->
<div id="lightbox" class="lightbox" hidden>
  <button class="lb-x" id="lbClose">✕</button>
  <img id="lbImg" alt="">
</div>

<script src="app.js"></script>
</body>
</html>
